name: LANFLUX checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lanflux-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

# Each full SHA was verified against its official actions/* release tag.
# Updates can be reviewed without granting checkout persistent Git credentials.
jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - name: Audit tracked release files
        run: |
          python scripts/check_release.py --self-test
          python scripts/check_release.py

  javascript:
    name: JavaScript and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: npm run test:unit
      - run: python scripts/check_frontend.py

  browser:
    name: Chromium and measured AI evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LANFLUX_SCREENSHOT_DIR: output/playwright/screenshots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Create the browser fixture's Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip check
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Real WebRTC transfers and metadata observations
        run: npm run test:e2e
      - name: Evaluate actual browser-exported observations
        run: |
          .venv/bin/python -m aiml.evaluate output/playwright/ai-observed.csv --output output/playwright/ai-holdout-${{ github.run_id }}-${{ github.run_attempt }}.csv > output/playwright/ai-evaluation-${{ github.run_id }}-${{ github.run_attempt }}.txt
          cat output/playwright/ai-evaluation-${{ github.run_id }}-${{ github.run_attempt }}.txt
      - name: Verify committed screenshots were preserved
        if: always()
        run: git diff --exit-code -- docs/screenshots
      - name: Save browser and evaluation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright/
          if-no-files-found: warn
          retention-days: 7
